      ## Writing‑Sample
      Para1: The experimental results indicate that schema-aware regularization reduces the representation variance caused by template-level differences, which helps the classifier rely on semantic instruction content rather than surface schema patterns. The category-balanced strategy further stabilizes decisions on minority categories by preventing high-frequency categories from dominating the training signal.
      Para2: Nevertheless, the method has intrinsic limitations. When a minority category contains very few samples, the schema prototype and category weights become less reliable, and performance degrades. The method also assumes that schema styles can be represented by shared structural patterns; when schemas are highly ambiguous or radically different across domains, this assumption may no longer hold.
      Para3: In future work, we intend to strengthen schema representation with contextualized schema modeling and explore cross-domain transfer so that the framework remains effective when categories, templates, and domains change together.

