name: paper_writer_v2_full
version: "2.5.1"
description: >
  IEEE/SCI论文分章节指导+写作生成技能。
  调整1：不再设置独立Related Work章节，全部前人研究、参考文献综述直接整合在Introduction内部。
  调整2：experimental_setup 开头增加现实挑战描述，实验部分先呼应论文提出的真实问题与挑战，再展开数据集、指标、基线、训练配置，与Introduction形成叙事闭环。
  调整3：若用户指定“按照本工程已经完成的实验结果撰写论文”，必须先读取当前工程中的实验结果、表格、日志或报告，并严格依据这些已完成实验撰写正文；不得虚构或补全缺失结果。
  调整4：面向IEEE Trans投稿写作标准，强调严谨学术表达、叙事闭环、工程价值、可复现性、贡献可验证、局限坦诚、符号统一、图表自解释、引用符合IEEEtran格式。
  触发条件：用户询问论文某一章节/子小节怎么写，或者需要撰写Abstract、Introduction、Problem Formulation、Method、Experiment、Ablation、Discussion‑Limitations、Conclusion、Rebuttal。
  输出固定三部分：
  1) Section‑Structure：该章节分段逻辑，每一段写作目标，段落数量，每段该讲什么；
  2) Writing‑Sample：对应IEEE风格英文学术示例文本，优先被动语态；
  3) Pitfall‑Notice：该章节高频踩坑点，禁止写法。
  强制约束：
  1. 绝不编造用户未提供的创新点、实验数据、符号；全部依赖user_core_content输入；涉及结果时以当前工程实际结果为准；
  2. Introduction固定5段范式：业界痛点 → 现有研究文献综述 → 剖析现有方法固有机制缺陷 → 本文解法与优势 → 分条列举贡献；
  3. experimental_setup 范式：场景与现实挑战 → 数据集 → 评价指标 → Baselines → 实现与超参；与引言提出问题前后呼应；
  4. 严格区分段落功能，背景、文献综述、动机、方法、结果不能混写；
  5. Method禁止写实验结果；Experiment禁止大段复述算法原理；
  6. 必须按照本工程已经完成的实验结果撰写涉及结果的章节；结果缺失时先明确说明，不编造数据；
  7. Problem Formulation必须落地：定义输入、输出、优化目标、约束条件，必要时给出学习目标或任务目标；
  8. IEEE Trans写作规范：优先被动语态；不使用空泛营销词；图表编号必须被正文引用；图注表注应自解释；引用统一使用IEEEtran/BibTeX格式；
  9. Abstract以贡献和意义为主，不要大量堆叠数据结果；如需量化证据，最多保留1个最关键结果；
  10. 输出不出现AI开场白，直接输出结构化内容。
parameters:
  type: object
  required:
    - section_name
    - user_core_content
  properties:
    section_name:
      type: string
      enum:
        ["abstract",
         "introduction",
         "problem_formulation",
         "method_overview",
         "method_module_detail",
         "experimental_setup",
         "main_result",
         "ablation_study",
         "discussion_limitations",
         "conclusion",
         "rebuttal"]
      description: >
        abstract：摘要
        introduction：引言（包含全部文献综述，无独立Related Work）
        problem_formulation：问题定义与形式化建模
        method_overview：方法总览
        method_module_detail：方法子模块细节
        experimental_setup：实验设置（开篇描述现实挑战）
        main_result：主要实验结果
        ablation_study：消融实验
        discussion_limitations：讨论与局限性
        conclusion：结论
        rebuttal：审稿回复
    user_core_content:
      type: string
      description: >
        用户输入关键信息：创新点、模块名字、数据集、指标、待解决问题、已有主流方法、该任务现实挑战；如果当前工程已有实验结果，应优先提供或指向实际结果文件。
        示例："创新点：schema指令去偏+类别平衡，解决LLM指令分布偏移；已有方法分为重采样、损失正则化两类；任务挑战：真实指令集类别不均衡、指令schema样式异构、高频类别主导训练数据；任务形式化：输入指令x与schema样式t，输出类别y，优化目标是加权指令分类损失；实际结果：Accuracy 91.7% vs best baseline 86.3%，macro-F1 87.2% vs 80.5%；实验结果见本工程result/experiment_results.csv"
  optional:
    experiment_results_path:
      type: string
      description: "本工程已完成实验结果文件路径，例如 result/experiment_results.csv；不提供时技能先扫描当前工程目录。"
    target_journal:
      type: string
      default: "IEEE Trans"
    language:
      type: string
      enum: ["en","zh"]
      default: "en"
examples:
  - input: |
      section_name: abstract
      user_core_content: 研究问题：LLM指令微调存在类别分布偏移；现有方法缺陷：重采样丢弃有效样本或产生重复噪声，损失正则化在指令schema异构时失效；方法：schema‑aware去偏模块+类别平衡训练策略；数据集：多模态指令数据集；实际结果：Accuracy 91.7%、macro-F1 87.2%，最优baseline为86.3%、80.5%；局限：小样本场景性能下降
      target_journal: TKDE
      language: en
    output: |
      ## Section‑Structure（4段逻辑；如期刊要求单段摘要，则压缩成一段，禁止分点罗列）
      Para1: 领域现状与关键痛点，直接落到真实任务和部署场景；
      Para2: 现有方法的具体短板，指出什么场景、什么假设下失效；
      Para3: 本文完成的核心设计，写机制与能力边界，不堆砌模块名；
      Para4: 贡献与工程意义为主；如需量化证据，最多保留1个最关键结果；可简述局限，不写未来工作。

      ## Writing‑Sample
      Instruction tuning has become a practical paradigm for aligning large language models with real-world instructions. In collected instruction datasets, however, category imbalance and heterogeneous schema styles cause the learned model to favor high-frequency categories and to underperform when instruction templates vary across deployments. Existing resampling-based methods discard informative samples or introduce duplicate noise, while loss-regularization methods fail when the same semantic instruction is expressed through inconsistent schemas. To address these limitations, this paper proposes a schema-aware debiasing module with explicit schema-consistency constraints and a category-balanced training strategy that preserves all original training samples. This design contributes a structure-aware mechanism for real instruction pipelines and provides a sample-preserving way to improve minority-category decisions. On a multi-modal instruction dataset, the proposed method improves Accuracy by 5.4 points over the best baseline. These results indicate that the framework can enhance practical reliability of instruction-tuned large language models under realistic category and schema distributions.

      ## Pitfall‑Notice
      1. 不要写领域科普或泛泛背景，第一句必须进入具体问题；
      2. 现有方法缺陷必须点明失效场景，不能只写“效果不好”；
      3. 摘要不要大量堆叠Accuracy、F1、baseline等数据，应把主要篇幅用于贡献和意义；
      4. 如需量化证据，最多保留1个最关键结果，不能把摘要写成压缩版结果表；
      5. 只使用实际实验结果，未提供指标时不得编造；
      6. 不要分点、不要公式、不要引用文献、不要写论文结构或大量未来工作。

  - input: |
      section_name: introduction
      user_core_content: 任务：多模态指令分类；问题：指令微调存在训练分布偏移，模型偏向高频类别，真实指令schema异构；已有方法分为重采样、损失正则化两类，均未显式建模schema；本文完成：schema指令去偏模块、类别平衡策略、schema异构是主导偏差源的分析洞察；贡献分类：方法论贡献、训练策略贡献、分析洞察贡献
      target_journal: TKDE
      language: en
    output: |
      ## Section‑Structure（固定5段，顺序不可调换，所有文献综述放在本章，不单独开Related Work）
      Para1: 领域/工业界真实痛点与任务定义，说明输入、输出、分布特征和落地瓶颈；只描述现实问题，不综述文献，不提本文方法。
      Para2: 文献综述，把相关工作按研究路线分组归类，引用代表性文献；每一组客观总结思路，不做逐篇复述。
      Para3: 剖析现有方法的**机制层面固有缺陷**，点明其在哪些场景、哪些假设下失效；解释为什么现有方案无法根治Para1提出的痛点。
      Para4: 阐述本文核心设计及其机制优势，精准对冲Para3的缺陷；说明每个设计解决哪个具体问题；禁止实验数值。
      Para5: 列出3‑4条可验证贡献，按方法论/训练策略/分析洞察或实验贡献分类；末尾用一句交代全文组织结构，贡献不写“进行了大量实验”这类空话。

      ## Writing‑Sample
      Para1: Recent large language models (LLMs) have achieved remarkable progress in instruction tuning and real‑world deployment. However, real instruction data are collected under unbalanced category distribution and heterogeneous schema styles. Given an instruction $x$ with its schema $t$, the model must predict a category $y$, yet high-frequency categories dominate training signals while diverse templates create inconsistent structural semantics. Such bias leads to unstable behavior and deployment failures in multi-modal instruction services.

      Para2: To mitigate class-imbalance bias in instruction tuning, existing methods mainly follow two research lines. Resampling-based approaches adjust sample frequency by oversampling minority samples or undersampling dominant categories [1]-[3]. Loss-regularization methods modify the training objective and impose output-level constraints for bias suppression [4]-[6]. These two families constitute the mainstream debiasing pipelines for instruction fine-tuning.

      Para3: Nevertheless, existing approaches still suffer from mechanism-level limitations. Resampling strategies may discard valuable training samples or introduce noisy duplicates, and they assume bias can be corrected by frequency adjustment alone. Loss-regularization methods operate only on model outputs and therefore cannot model the structural inconsistency introduced by heterogeneous instruction schemas. When the same semantic instruction appears with varied templates, neither family explicitly separates schema shift from category imbalance, so they cannot guarantee stable debiasing under real-world distribution shift.

      Para4: Different from previous heuristic correction pipelines, this paper proposes a schema-aware debiasing framework combined with a category-balanced training strategy. The framework explicitly models structural semantics in heterogeneous instruction templates, so that category balancing is performed without discarding informative samples. This mechanism directly addresses the schema-level limitation of existing approaches and reduces distribution shift in real-world instruction datasets.

      Para5: The main contributions of this paper are summarized as follows:
      1. We propose a schema-aware debiasing module that constructs explicit schema-consistency constraints, addressing the overlooked structural inconsistency in heterogeneous instruction templates.
      2. We design a category-balanced training strategy that preserves the original training distribution while suppressing the over-reliance on high-frequency categories.
      3. We analyze real instruction distributions and reveal that schema inconsistency is a dominant bias source that cannot be removed by output-level regularization alone.
      The remainder of this paper is organized as follows. Section 2 formalizes the instruction debiasing problem. Section 3 presents the proposed framework. Experimental settings, results, and ablation studies are reported in Sections 4-6, followed by discussion and conclusions.

      ## Pitfall‑Notice
      1. Para1只写业界痛点，禁止文献、禁止本文方法；
      2. Para2完成全部文献综述，分类概括已有工作，**不要深度批判，只客观介绍路线**；
      3. Para3必须解释机制层面的短板，指出失效场景，不能只写“效果不好”；
      4. Para4逻辑闭环：本文优势一一对应Para3指出的缺陷；禁止出现实验指标；
      5. Para5贡献必须分条罗列，不要大段文本；贡献是“完成、设计、揭示”这类可验证内容，不是“研究了问题”或“进行了大量实验”；
      6. Introduction全文禁止实验数据、表格、消融结果、公式；
      7. 全文不再出现独立Related Work章节，所有相关工作引用全部收拢在此处；
      8. 贡献和后续Method/Experiment必须能一一对应，不能出现论文后面没有验证或没有实现的贡献；
      9. 组织句不要写成“Section 2 reviews related work”，因为本文没有独立相关工作章节。

  - input: |
      section_name: problem_formulation
      user_core_content: 任务：多模态指令分类；输入为指令文本x与schema样式t，输出为类别标签y；训练数据D呈现类别不均衡且schema异构；约束：不丢弃原始样本；目标：同时缓解类别分布偏移和schema不一致导致的预测偏差
      target_journal: TKDE
      language: en
    output: |
      ## Section‑Structure（3段）
      Para1: 把应用问题落地成学习任务，给出输入、输出、样本空间和真实数据分布挑战；
      Para2: 建立形式化符号体系，定义数据集、模型、类别、schema变量和主要假设；
      Para3: 给出优化目标、约束条件与评价逻辑，说明为什么要同时建模类别分布和schema结构。

      ## Writing‑Sample
      Para1: We formulate instruction debiasing as a supervised multi-modal instruction classification task. Each sample is an instruction text associated with a schema style, and the goal is to predict the intended category while remaining robust to both category imbalance and schema heterogeneity in real-world data.
      Para2: Let $\mathcal X$ denote the instruction space, $\mathcal T$ denote the schema style space, and $\mathcal Y$ denote the category set. A training sample is represented as $(x_i,t_i,y_i)$, where $x_i\in\mathcal X$ is the instruction content, $t_i\in\mathcal T$ is the schema style, and $y_i\in\mathcal Y$ is the ground-truth category. The collected dataset $\mathcal D=\{(x_i,t_i,y_i)\}_{i=1}^{N}$ is imbalanced over $\mathcal Y$ and contains heterogeneous templates over $\mathcal T$.
      Para3: Given a model $f_{\theta}:\mathcal X\times\mathcal T\mapsto\mathcal Y$, the training objective is formulated as
      \[
      \theta^*=\arg\min_{\theta}\ \mathcal L_{\text{task}}(\theta;\mathcal D)+\lambda \mathcal R_{\text{schema}}(\theta;\mathcal D)
      \]
      where $\mathcal L_{\text{task}}$ denotes the category-aware classification loss, $\mathcal R_{\text{schema}}$ penalizes representation inconsistency across heterogeneous schemas, and the optimization is constrained to preserve all original minority samples.

      ## Pitfall‑Notice
      1. 不要只写“分布偏移”这种宏大概念，必须定义输入、输出、样本和评价目标；
      2. 所有符号第一次出现时必须给出定义，后续Method不能更换含义；
      3. 这里不写实验结果，也不展开某个具体模块的全部细节；
      4. 优化目标需要写清楚约束，避免读者无法复现损失函数和训练目标；
      5. 问题形式化后要与Introduction痛点、Method模块一一对应。

  - input: |
      section_name: method_overview
      user_core_content: 整体流水线：预训练LLM，输入指令与schema，经过schema‑aware去偏模块，再接入类别平衡训练策略，输出模型；设计动机：schema模块对应解决C1 schema异构偏差，类别平衡策略对应解决C2类别不均衡且不丢弃样本；需给出整体框架图说明
      target_journal: TKDE
      language: en
    output: |
      ## Section‑Structure（3段）
      Para1: 先引用总架构图，说明输入输出、整体流水线和各阶段的数据流向；不展开公式。
      Para2: 逐个说明子模块的职责与设计动机，明确指出每个模块对应解决前面提出的哪个挑战或缺陷。
      Para3: 说明模块之间的协作顺序、训练推理关系，并预告后续消融如何验证这些设计假设。

      ## Writing‑Sample
      Para1: The overall pipeline of the proposed method is illustrated in Figure X. Given a pre-trained large language model, each instruction and its schema style are first encoded and passed to the schema-aware debiasing module. The regularized representations are then optimized by the category-balanced training strategy. The final aligned model is obtained after fine-tuning and can be used for instruction classification.
      Para2: The schema-aware debiasing module is designed to address Challenge C1, where heterogeneous instruction schemas create inconsistent structural semantics. It regularizes representations according to shared schema patterns. The category-balanced training strategy is designed to address Challenge C2, suppressing the dominance of high-frequency categories without discarding any original training sample.
      Para3: The two modules are jointly optimized in one framework. The schema module provides structure-aware representations, and the category-balanced objective uses those representations to improve minority-category decisions. Ablation studies in Section X will verify that each module contributes independently and that their combination yields the best performance.

      ## Pitfall‑Notice
      1. 不要在这里写公式、推导；公式放到method_module_detail；
      2. 不要写实验结果；
      3. 每个模块都要先交代“解决什么问题”，不能直接抛出一堆模块名；
      4. 总览必须对应图的描述，不能出现正文没引用或图里没有对应信息的模块；
      5. 模块动机要能被后续消融实验验证，不能只讲结构不讲假设。

  - input: |
      section_name: method_module_detail
      user_core_content: 两个子模块：schema‑aware debiasing module、category‑balance strategy；schema模块解决schema异构；类别平衡策略不丢弃样本；符号体系：h_i为指令嵌入，h_schema为schema原型，w_c为类别权重，c为类别，y_c与yhat_c分别为真实与预测类别；训练总损失为任务损失、schema正则与类别平衡损失的加权和
      target_journal: TKDE
      language: en
    output: |
      ## Section‑Structure（4段）
      Para1: 先给形式化符号体系与模块设计动机，说明本节每个设计解决哪个已定义的问题；
      Para2: 第一个子模块：动机→数学定义→计算流程→公式之后的自然语言解释；
      Para3: 第二个子模块：动机→数学定义→计算流程→公式之后的自然语言解释；
      Para4: 总损失与模块协同关系、训练阶段流程，并说明实现中的可复现细节。

      ## Writing‑Sample
      Para1: We use $\boldsymbol h_i$ to denote the instruction embedding of sample $i$, $\boldsymbol h_{\text{schema}}$ to denote the aggregated schema prototype, $w_c$ to denote the category-specific weight, $y_c$ and $\hat y_c$ to denote the ground-truth and predicted one-hot labels of category $c$. The schema-aware debiasing module targets Challenge C1, while the category-balanced strategy targets Challenge C2.
      Para2: The schema-aware debiasing module regularizes instruction representations to mitigate schema-level distribution bias. Given instruction embedding $\boldsymbol h_i$, we construct schema-consistency constraints to penalize representations that deviate from shared instruction schema patterns. The regularization loss is formulated as:
      \[
      \mathcal L_{\text{schema}}=\sum_{i}\|\boldsymbol h_i-\boldsymbol h_{\text{schema}}\|_2^2
      \]
      where $\boldsymbol h_{\text{schema}}$ denotes the aggregated schema prototype. This term encourages samples sharing the same semantic schema to remain close in representation space, thereby reducing variance caused by template-level differences.
      Para3: The category‑balance strategy further adjusts training objective to counteract category imbalance. We introduce category‑weighted cross‑entropy loss to assign higher weights to minority categories. The weighted loss is computed as:
      \[
      \mathcal L_{\text{balance}}=-\sum_{c}w_c y_{c}\log(\hat y_{c})
      \]
      where $w_c$ represents the category-specific weight inversely proportional to sample frequency. In contrast to sample resampling, this strategy does not discard or duplicate samples and therefore preserves the original instruction data.
      Para4: The total training loss is the weighted sum of the original task loss, schema regularization loss, and category-balanced loss. The modules share the same representation encoder and are optimized jointly during training.

      ## Pitfall‑Notice
      1. 只讲方法，**绝对不要出现实验结果、对比baseline**；
      2. 所有符号必须在首次出现时定义，并保证字体、下标含义与Problem Formulation一致；
      3. 每个公式之后必须有自然语言解释，不能只堆公式；
      4. 每个模块必须对应一个设计动机，并为后续Ablation提供待验证假设；
      5. 不要写训练参数；训练参数放到experimental_setup；
      6. 不要大段讲故事，优先数学+实现逻辑。

  - input: |
      section_name: experimental_setup
      user_core_content: 任务挑战：真实指令集类别不均衡、指令schema样式异构、高频类别主导训练数据；数据集：120,000条多模态指令、68个类别、类别长尾比约21:1、按80/10/10划分；评价指标：Accuracy、macro-F1；baseline：按原始论文配置的重采样与损失正则化方法；训练超参：batch size 32、学习率5e-5、10 epochs；实现环境：PyTorch、NVIDIA A100、统一随机种子
      target_journal: TKDE
      language: en
    output: |
      ## Section‑Structure（4段，顺序不可调换；开篇描述任务现实挑战，与Introduction痛点呼应）
      Para1: 描述本任务现实挑战，复现论文要解决的核心困难，说明实验协议为什么保留真实不均衡和schema异构；**不给出结果**。
      Para2: 数据集介绍：规模、任务类型、类别分布、schema分布、划分方式；给出保证公平评价所需的数据特性。
      Para3: 评价指标、baseline分组与来源，说明每个baseline的版本、超参来源、为什么纳入对比；强调所有方法共用评价协议。
      Para4: 训练配置：batch size、学习率、epoch、优化器、随机种子、硬件、框架；实现细节达到可复现程度。

      ## Writing‑Sample
      Para1: Real-world instruction tuning scenarios are confronted with imbalanced category distribution and heterogeneous instruction schemas. High-frequency categories dominate training samples, while diverse instruction templates introduce inconsistent structural semantics. To evaluate debiasing under practical conditions, our protocol deliberately preserves this distribution rather than rebalancing the testbed.
